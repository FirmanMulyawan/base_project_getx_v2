name: firman_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  flutter_dotenv: ^5.2.1
  flutter_native_splash: ^2.4.4
  dio: ^5.8.0+1
  shimmer: ^3.0.0
  lottie: ^3.2.0
  readmore: ^3.0.0
  cached_network_image: ^3.4.1
  # flutter_widget_from_html: ^0.16.0
  # webview_flutter: ^4.10.0
  skeletonizer: ^1.4.3
  flutter_staggered_grid_view: ^0.7.0
  intl: ^0.20.2
  email_validator: ^3.0.0
  flutter_svg: ^2.0.17
  flutter_secure_storage: ^9.2.4
  permission_handler: ^12.0.0+1
  logger: ^2.5.0
  dotted_border: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/demo-icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/icons/
    - assets/images/
    - assets/lottie/
    - .env

  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/lato/Lato-Light.ttf
          weight: 300

        - asset: assets/fonts/lato/Lato-Regular.ttf
          weight: 400

    - family: Raleway
      fonts:
        - asset: assets/fonts/raleway/Raleway-Bold.ttf
          weight: 700

        - asset: assets/fonts/raleway/Raleway-Heavy.ttf
          weight: 900

        - asset: assets/fonts/raleway/Raleway-Medium.ttf
          weight: 600

        - asset: assets/fonts/raleway/Raleway-Regular.ttf
          weight: 400

        - asset: assets/fonts/raleway/Raleway-SemiBold.ttf
          weight: 600
